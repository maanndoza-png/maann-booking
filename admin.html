<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<style>
:root{--gold:#d4a62a;--green:#34c38f;--red:#f1556c;--blue:#4c8dff;--purple:#9b6cf0;--onGold:#1f1a05}
[data-theme=dark]{--bg:#070b16;--panel:#0d1424;--panel2:#121b30;--line:#1f2a44;--ink:#e8ecf5;--mute:#8d99b5;--hover:#16213a}
[data-theme=light]{--bg:#f4f1e8;--panel:#fff;--panel2:#faf8f3;--line:#e5dfcf;--ink:#1f2328;--mute:#6b7280;--hover:#f1ecdd}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#login{max-width:340px;margin:90px auto;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:240px;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;overflow:auto;z-index:30;transition:transform .2s}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--onGold);display:grid;place-items:center;font-size:20px}
.brand b{display:block;letter-spacing:.5px}.brand small{color:var(--gold);font-weight:700;font-size:11px;letter-spacing:.8px}
aside button.nv{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--mute);padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer;margin-bottom:2px}
aside button.nv:hover{background:var(--hover);color:var(--ink)}
aside button.nv.on{background:var(--gold);color:var(--onGold);font-weight:700}
.status{margin:14px 8px 0;font-size:12px;color:var(--mute)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 12px 256px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer}
#burger{display:none}
main{padding:20px 16px 40px 256px;max-width:1280px}
h1{margin:0 0 4px;font-size:26px;font-family:Georgia,serif}h2{margin:0 0 4px;font-size:17px;font-family:Georgia,serif}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi small{color:var(--mute);font-size:11px;letter-spacing:.6px;text-transform:uppercase}.kpi b{display:block;font-size:26px;margin:6px 0 4px}.kpi i{font-style:normal;color:var(--green);font-size:11px;font-weight:700}
.g{display:grid;gap:14px;grid-template-columns:2fr 1fr}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mute{color:var(--mute);font-size:13px}
.btn{background:var(--gold);color:var(--onGold);border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer}
.btn.sec{background:var(--secBg,var(--panel2));color:var(--secText,var(--ink));border:1px solid var(--line)}.btn.ok{background:var(--green);color:#04281a}.btn.bad{background:var(--red);color:#fff}.btn.sm{padding:6px 10px;font-size:13px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:var(--panel2);color:var(--ink)}
input[type=color]{padding:2px;height:42px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chk{display:flex;align-items:center;gap:8px;margin-top:6px}.chk input{width:auto}.chk label{margin:0;color:var(--ink);font-size:14px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}
.Pending{background:#4a3b0b;color:#ffd666}.Confirmed{background:#0f3b2a;color:#5ee0a4}.Cancelled{background:#4a1520;color:#ff8da0}
[data-theme=light] .Pending{background:#fff1c9;color:#7a5a00}[data-theme=light] .Confirmed{background:#d8f1e2;color:#1d6b40}[data-theme=light] .Cancelled{background:#f8d9de;color:#a3243a}
svg .grid{stroke:var(--line);stroke-width:1}svg .ax{fill:var(--mute);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:6px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs div{position:relative}.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:8px}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer}
.err{color:var(--red);font-size:14px;margin:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{font-size:11px;color:var(--mute);text-align:center;padding:4px}
.cd{min-height:78px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;font-size:11px;cursor:pointer;overflow:hidden}
.cd:hover{border-color:var(--gold)}.cd.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.cd.past{opacity:.5}
.cd .n{font-weight:700;font-size:12px}.cd .hd{color:var(--purple)}
.ev{border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px}
.ev.C{background:#0f3b2a;color:#5ee0a4}.ev.P{background:#4a3b0b;color:#ffd666}.ev.K{background:#2a2f3e;color:#aab2c5}
[data-theme=light] .ev.C{background:#d8f1e2;color:#1d6b40}[data-theme=light] .ev.P{background:#fff1c9;color:#7a5a00}[data-theme=light] .ev.K{background:#e6e6e6;color:#555}
@media(max-width:900px){aside{transform:translateX(-100%)}aside.open{transform:none}.top{padding-left:16px}main{padding-left:16px}#burger{display:inline-block}.g{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login"><div class="card"><h2 id="lt">Sign in</h2>
<div id="lform"><label>Email</label><input type="email" id="em" autocomplete="username"><label>Password</label><input type="password" id="pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><div class="err" id="le"></div><button class="btn" style="width:100%;margin-top:6px" onclick="login()">Sign in</button>
<p class="mute" style="text-align:center;margin:14px 0 0">New host? <a href="#" onclick="showSignup(event)" style="color:var(--gold)">Create a host account</a></p></div>
<div id="sform" style="display:none"><label>Your name</label><input id="sn" autocomplete="name"><label>Business / property name</label><input id="sb"><label>What will you use this app for?</label><select id="si"><option value="">— Select —</option><option value="business">💼 1. Other business</option><option value="real_estate">🏘️ 2. Property Listing</option><option value="staycation">🏠 3. Booking App (staycation)</option></select><div class="mute" style="margin:4px 0 8px">Choosing one locks the other two. You can pay later to unlock them.</div><label>Phone</label><input id="sp" type="tel"><label>Email</label><input id="se" type="email" autocomplete="email"><label>Password (min 8 characters)</label><input type="password" id="sw" autocomplete="new-password"><div class="err" id="sx"></div><button class="btn" style="width:100%;margin-top:6px" onclick="doSignup()">Request host account</button>
<p class="mute" style="text-align:center;margin:14px 0 0">Already have an account? <a href="#" onclick="showLogin(event)" style="color:var(--gold)">Sign in</a></p></div>
</div></div>

<div id="app">
  <aside id="side"><div class="brand"><div class="logo">🏠</div><div><b id="bn">ADMIN</b><small>MANAGEMENT PORTAL</small></div></div><div id="nav"></div>
    <div class="status"><span class="dot"></span><span id="st">Online &amp; Synced</span></div></aside>
  <div class="top"><div><button class="pill" id="burger" onclick="$('#side').classList.toggle('open')">☰</button> <span class="pill" id="clk"></span></div>
    <div class="r"><button class="pill" id="indp" onclick="go('industries')" style="display:none"></button><button class="pill" onclick="toggleTheme()">🌓</button><a class="pill" id="vs" href="#" target="_top" style="text-decoration:none">View site</a><button class="pill" onclick="logout()">Log out</button></div></div>
  <main id="main"></main>
</div>

<script>
const SITE_BASE = '';  // set to your hosting address, e.g. 'https://yourname.github.io/booking/' (leave empty if admin.html and index.html sit in the same folder)
// ===== Supabase connection (plain fetch, no library). Publishable key is safe in the browser: row-level security protects the data. =====
const SBX = (() => {
  const BASE = 'https://wqngwiagcoehytfbexil.supabase.co', KEY = 'sb_publishable_Gb7BwZtFLVt5pnZ4chSccA_XuenGpK6';
  function make(skey) {
    let sess = null;
    try { sess = JSON.parse(sessionStorage.getItem(skey) || 'null'); } catch (e) {}

      try {
        if (!sess || !sess.refresh_token) return false;
        const r = await fetch(BASE + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: sess.refresh_token }) });
        const j = await r.json().catch(() => null);
        if (r.ok && take(j)) return true;
        save(null); return false;
      } finally { refreshing = null; }
    })());
    async function raw(path, o = {}, retry = true) {
      if (!o.anon && sess && sess.expires_at - 60 < Date.now() / 1000) await refresh();
      const h = Object.assign({ apikey: KEY }, o.headers || {});
      h.Authorization = 'Bearer ' + ((!o.anon && sess && sess.access_token) || KEY);
      let body = o.body;
      if (body !== undefined && typeof body !== 'string' && !(typeof Blob !== 'undefined' && body instanceof Blob)) { h['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
      const r = await fetch(BASE + path, { method: o.method || (body !== undefined ? 'POST' : 'GET'), headers: h, body });
      const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
      if (r.status === 401 && retry && !o.anon && sess && sess.refresh_token) { if (await refresh()) return raw(path, o, false); throw new Error('Session expired. Please sign in again.'); }
      if (!r.ok) throw new Error(nice(msg(j, r.status)));
      return j;
    }
    const enc = p => p.split('/').map(encodeURIComponent).join('/');
    return {
      raw, BASE,
      get session() { return sess; }, get uid() { return sess && sess.user && sess.user.id; },
      async signIn(email, password) {
        const j = await raw('/auth/v1/token?grant_type=password', { anon: true, body: { email: String(email || '').trim(), password: String(password || '') } });
        take(j); return j.user;
      },
      async signUp(email, password, data) {
        const j = await raw('/auth/v1/signup', { anon: true, body: { email: String(email || '').trim(), password: String(password || ''), data: data || {} } });
        return take(j) ? j.user : null;     // null = email confirmation is switched on in Supabase
      },
      async signOut() { try { await raw('/auth/v1/logout', { method: 'POST' }); } catch (e) {} save(null); },
      async setPassword(pw) { return raw('/auth/v1/user', { method: 'PUT', body: { password: pw } }); },
      rpc: (fn, args) => raw('/rest/v1/rpc/' + fn, { body: args || {} }),
      sel: (table, q) => raw('/rest/v1/' + table + (q ? '?' + q : '')),
      ins: (table, row) => raw('/rest/v1/' + table, { method: 'POST', body: row, headers: { Prefer: 'return=representation' } }),
      upd: (table, q, patch) => raw('/rest/v1/' + table + '?' + q, { method: 'PATCH', body: patch, headers: { Prefer: 'return=representation' } }),
      ups: (table, row, conflict) => raw('/rest/v1/' + table + (conflict ? '?on_conflict=' + conflict : ''), { method: 'POST', body: row, headers: { Prefer: 'resolution=merge-duplicates,return=representation' } }),
      del: (table, q) => raw('/rest/v1/' + table + '?' + q, { method: 'DELETE', headers: { Prefer: 'return=representation' } }),
      upload: (bucket, path, blob) => raw('/storage/v1/object/' + bucket + '/' + enc(path), { method: 'POST', body: blob, headers: { 'Content-Type': blob.type || 'application/octet-stream', 'x-upsert': 'false' } }),
      publicUrl: (bucket, path) => BASE + '/storage/v1/object/public/' + bucket + '/' + enc(path),
      async signed(bucket, paths) {
        if (!paths.length) return {};
        const j = await raw('/storage/v1/object/sign/' + bucket, { body: { expiresIn: 3600, paths } });
        const m = {}; (j || []).forEach(x => { if (x.signedURL) m[x.path] = BASE + '/storage/v1' + x.signedURL; }); return m;
      },
      fn: (name, body) => raw('/functions/v1/' + name, { body })
    };
  }
  return { make };
})();
const manilaToday = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
const dataUrlBlob = async d => { const m = String(d).match(/^data:([\w\/+.-]+);base64,/); if (!m) throw new Error('Invalid image.'); const r = await fetch(d); return r.blob(); };

// ===== Host portal adapter: same rpc()/api() interface the portal already uses, backed by Supabase =====
const A = SBX.make('sb_admin');
const UNIT_BUCKET = 'unit-photos', PROOF = 'payment-proofs';
const INDUSTRIES = [['staycation', 'Booking App (staycation)', '🏠'], ['real_estate', 'Property Listing', '🏘️'], ['business', 'Other business', '💼']];
const IND_NAME = Object.fromEntries(INDUSTRIES.map(i => [i[0], i[1]]));
const nz = v => v == null ? '' : v;
const unitOut = u => ({ id: u.id, ownerId: u.owner_id, name: u.name, location: u.location, price: u.price, baseGuests: u.base_guests, maxGuests: u.max_guests, extraGuestFee: u.extra_guest_fee,
  petsAllowed: u.pets_allowed, petFee: u.pet_fee, rating: u.rating, beds: u.beds, bedrooms: u.bedrooms, bathrooms: u.bathrooms, checkInTime: String(u.check_in_time || '14:00').slice(0, 5),
  checkOutTime: String(u.check_out_time || '11:00').slice(0, 5), description: u.description, images: (u.images || []).join(','), amenities: (u.amenities || []).join(',') });
const num = v => Number(v) || 0, clean = (v, n = 200) => String(v == null ? '' : v).trim().slice(0, n);
const dd = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
let _me = null;
async function loadMe() {
  const uid = A.uid; if (!uid) throw new Error('Session expired. Please sign in again.');
  const [p] = await A.sel('profiles', 'id=eq.' + uid + '&select=*');
  if (!p) throw new Error('Account not found.');
  if (p.role === 'guest') throw new Error('This is a guest account. Guests sign in on the booking page.');
  if (p.status === 'pending') { await A.signOut(); throw new Error('Your host account is waiting for approval.'); }
  if (p.status !== 'active') { await A.signOut(); throw new Error('This account is disabled.'); }
  const acc = p.role === 'host' || p.role === 'admin' ? await A.sel('industry_access', 'owner_id=eq.' + p.id + '&select=industry,paid_until,source') : [];
  const now = Date.now(), inds = acc.filter(x => !x.paid_until || Date.parse(x.paid_until) > now).map(x => x.industry);
  _me = { id: p.id, role: p.role, name: p.name, email: p.email, phone: p.phone, businessName: p.business_name, paymentInfo: nz(p.payment_info), perms: p.perms,
    ownerId: p.role === 'staff' ? p.owner_id : p.id, businessType: p.business_type, industries: inds, needsIndustry: p.role === 'host' && !acc.length,
    logoUrl: p.logo_url, tagline: p.tagline, about: p.about, ownerPhotoUrl: p.owner_photo_url, contactPhone: p.contact_phone, contactEmail: p.contact_email,
    socials: p.socials || {}, testimonials: p.testimonials || [], site: p.site || {}, token: 'sb' };
  if (p.role === 'staff') { const [o] = await A.sel('profiles', 'id=eq.' + p.owner_id + '&select=business_type,business_name'); _me.businessType = o && o.business_type; _me.businessName = o && o.business_name; }
  return _me;
}
async function upPhoto(dataUrl, kind) {
  const blob = await dataUrlBlob(dataUrl); const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace(/[^a-z0-9]/gi, '');
  const path = A.uid + '/' + kind + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.' + ext;
  await A.upload(UNIT_BUCKET, path, blob); return A.publicUrl(UNIT_BUCKET, path);
}
const monthsList = (period, B, E) => {
  const t = manilaToday(); let y = +t.slice(0, 4), m = +t.slice(5, 7); let n = { m1: 1, m3: 3, m6: 6, m12: 12 }[period];
  if (!n) { const all = B.map(b => String(b.checkIn).slice(0, 7)).concat(E.map(e => String(e.date).slice(0, 7))).filter(Boolean).sort(); n = all.length ? Math.min(36, (y - +all[0].slice(0, 4)) * 12 + (m - +all[0].slice(5, 7)) + 1) : 1; }
  const out = []; for (let i = n - 1; i >= 0; i--) { let mm = m - i, yy = y; while (mm < 1) { mm += 12; yy--; } out.push(yy + '-' + String(mm).padStart(2, '0')); } return out;
};
async function bookingsAll() {
  const r = await A.sel('bookings', 'select=*,units(name)&order=created_at.desc');
  const paths = r.map(b => b.proof_path).filter(Boolean); let urls = {}; try { urls = await A.signed(PROOF, paths); } catch (e) {}
  return r.map(b => ({ id: b.ref, uuid: b.id, unitId: b.unit_id, unitName: b.units ? b.units.name : '', checkIn: b.check_in, checkOut: b.check_out, nights: b.nights, guestName: b.guest_name, email: b.email, phone: b.phone,
    guests: b.guests, pets: b.pets ? 'Yes' : 'No', addons: (Array.isArray(b.addons) ? b.addons : []).map(a => a.name || a).join(', '), total: b.total, proofUrl: urls[b.proof_path] || '', status: b.status, createdAt: String(b.created_at).slice(0, 16).replace('T', ' ') }));
}
async function dashboardStay(period) {
  const [B0, E0, U0] = await Promise.all([bookingsAll(), A.sel('expenses', 'select=*'), A.sel('units', 'active=eq.true&select=id,name')]);
  const B = B0, E = E0.map(e => ({ date: e.date, amount: e.amount })), months = monthsList(period, B, E), set = Object.fromEntries(months.map(m => [m, 1])), last = months[months.length - 1];
  const start = months[0] + '-01'; let ny = +last.slice(0, 4), nm = +last.slice(5, 7) + 1; if (nm > 12) { nm = 1; ny++; } const endEx = ny + '-' + String(nm).padStart(2, '0') + '-01';
  const bk = B.filter(b => set[String(b.checkIn).slice(0, 7)]), ex = E.filter(e => set[String(e.date).slice(0, 7)]), conf = bk.filter(b => b.status === 'Confirmed');
  const sum = (a, f) => a.reduce((s, x) => s + Number(f(x)), 0), revenue = sum(conf, b => b.total), expenses = sum(ex, e => e.amount);
  const trend = months.map(m => ({ m, confirmed: bk.filter(b => b.status === 'Confirmed' && b.checkIn.slice(0, 7) === m).length, cancelled: bk.filter(b => b.status === 'Cancelled' && b.checkIn.slice(0, 7) === m).length }));
  const finance = months.map(m => { const r = sum(conf.filter(b => b.checkIn.slice(0, 7) === m), b => b.total), x = sum(ex.filter(e => String(e.date).slice(0, 7) === m), e => e.amount); return { m, revenue: r, expenses: x, net: r - x }; });
  const span = dd(start, endEx);
  const occupancy = U0.map(u => { let n = 0; B.forEach(b => { if (b.status !== 'Confirmed' || b.unitId !== u.id) return; const a = b.checkIn > start ? b.checkIn : start, z = b.checkOut < endEx ? b.checkOut : endEx; if (z > a) n += dd(a, z); }); return { unit: u.name, nights: n, pct: span ? Math.round(n / span * 1000) / 10 : 0 }; });
  const peak = occupancy.slice().sort((a, b) => b.nights - a.nights)[0], avg = occupancy.length ? Math.round(occupancy.reduce((s, o) => s + o.pct, 0) / occupancy.length * 10) / 10 : 0;
  return { period, months, kpi: { revenue, confirmed: conf.length, pending: bk.filter(b => b.status === 'Pending').length, cancelled: bk.filter(b => b.status === 'Cancelled').length, total: bk.length, expenses, net: revenue - expenses, opexPct: revenue ? Math.round(expenses / revenue * 1000) / 10 : 0, unitCount: U0.length },

function qrShow(title, link) {
  let m; try { m = qrMake(link); } catch (e) { return alert(e.message); }
  const s = 10, q = 4, n = m.length, cv = document.createElement('canvas'); cv.width = cv.height = (n + 2 * q) * s;

  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) c.fillRect((x + q) * s, (y + q) * s, s, s);
  const png = cv.toDataURL('image/png'), o = document.createElement('div');
  o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px';
  o.onclick = e => { if (e.target === o) o.remove(); };
  o.innerHTML = `<div class="card" style="max-width:340px;width:100%;text-align:center"><h2 style="margin:0 0 4px">${esc(title)}</h2><p class="mute" style="margin:0 0 10px">Guests scan this with their phone camera.</p>
    <img src="${png}" alt="QR code" style="width:100%;max-width:280px;image-rendering:pixelated;border-radius:8px;background:#fff">
    <div class="mute" style="word-break:break-all;font-size:11px;margin:8px 0">${esc(link)}</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><a class="btn sm" download="${esc(title.replace(/[^\w-]+/g, '-'))}-QR.png" href="${png}">Download PNG</a><button class="btn sec sm" onclick="this.closest('.card').parentNode.remove()">Close</button></div>
    <div class="mute" style="font-size:12px;margin-top:8px">If Download does nothing, press and hold the code to save it.</div></div>`;
  document.body.appendChild(o);
}

function resize(file, max = 1400) {
  return new Promise((ok, no) => { const img = new Image(), r = new FileReader();
    r.onload = () => { img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = img.width * k; cv.height = img.height * k; cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); ok(cv.toDataURL('image/jpeg', .8)); }; img.onerror = () => no(new Error('Bad image')); img.src = r.result; };
    r.onerror = () => no(new Error('Bad file')); r.readAsDataURL(file); });
}
async function upImgs(el) {
  const files = [...el.files]; let n = 0;
  for (const f of files) { $('#upst').textContent = `Uploading ${++n} of ${files.length}…`; try { editing.images.push(await api('uploadImage', { data: await resize(f) })); drawThumbs(); } catch (e) { $('#ue').textContent = e.message; } }
  $('#upst').textContent = 'Uploaded ✓'; el.value = '';
}

  const l = await api('products');
  $('#main').innerHTML = head('My Products', 'Things you sell. Guests see them on your website and contact you to order.', '<button class="btn" onclick="editProduct()">+ New product</button>') + '<div id="pf"></div>' +
    (l.map(x => `<div class="card"><div class="row"><b>${esc(x.name)}</b><b>${peso(x.price)}</b></div><div class="mute">${x.stock === '' ? 'Always available' : esc(x.stock) + ' in stock'} · ${esc(x.description)}</div>
      ${x.images[0] ? `<img src="${esc(x.images[0])}" alt="" style="height:60px;border-radius:8px;margin-top:6px">` : ''}
      <div style="margin-top:6px"><button class="btn sec sm" onclick='editProduct(${JSON.stringify(x).replace(/'/g, '&#39;')})'>Edit</button> <button class="btn sec sm" onclick="if(confirm('Remove product?'))act('deleteProduct',{id:'${esc(x.id)}'})">✕</button></div></div>`).join('') || '<p class="mute">No products yet.</p>');
}
function editProduct(x) {
  x = x || { name: '', description: '', price: 0, stock: '', images: [] }; PE = { ...x, images: (x.images || []).slice() };
  $('#pf').innerHTML = `<div class="card"><h2>${x.id ? 'Edit' : 'New'} product</h2><label>Name</label><input id="pr_name" value="${esc(PE.name)}"><div class="g2"><div><label>Price (₱)</label><input id="pr_price" type="number" value="${esc(PE.price)}"></div><div><label>Stock (leave empty if unlimited)</label><input id="pr_stock" type="number" value="${esc(PE.stock)}"></div></div>
    <label>Description</label><textarea id="pr_description" rows="3">${esc(PE.description)}</textarea><label>Photos</label><div id="pr_th" class="row" style="justify-content:flex-start;gap:6px;flex-wrap:wrap"></div><input type="file" accept="image/*" multiple onchange="prUp(this)"><div class="err" id="pr_e"></div>
    <button class="btn" onclick="saveProd()">Save product</button> <button class="btn sec" onclick="load()">Cancel</button></div>`; drawPTh(); $('#pf').scrollIntoView();
}
function drawPTh() { $('#pr_th').innerHTML = PE.images.map((s, i) => `<div><img src="${esc(s)}" style="height:60px;border-radius:8px"><br><a href="#" onclick="PE.images.splice(${i},1);drawPTh();return false">remove</a></div>`).join(''); }
async function prUp(el) { for (const f of [...el.files]) { try { PE.images.push(await api('uploadImage', { data: await resize(f) })); drawPTh(); } catch (e) { $('#pr_e').textContent = e.message; } } el.value = ''; }
async function saveProd() { try { await api('saveProduct', { id: PE.id, images: PE.images, name: $('#pr_name').value, price: $('#pr_price').value, stock: $('#pr_stock').value, description: $('#pr_description').value }); load(); } catch (e) { $('#pr_e').textContent = e.message; } }

</script>
</body>
</html>
