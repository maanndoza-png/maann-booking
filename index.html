<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking</title>
<style>
:root{--ink:#1f2328;--mute:#6b7280;--line:#e7e2d6;--bg:#faf8f3;--panel:#fff;--gold:#d4a62a;--gold2:#b98b12;--ok:#2e8b57;--bad:#c0392b;--hol:#7b5ea7;--free:#eef7f1;--occ:#f3d9d6;--holb:#ece4f6;--mid:#f6e6ad;--chip:#eee}
[data-theme=dark]{--ink:#e8ecf5;--mute:#8d99b5;--line:#1f2a44;--bg:#070b16;--panel:#0d1424;--free:#12301f;--occ:#3a1a1f;--holb:#2a1f45;--mid:#4a3b0b;--chip:#16213a;--hol:#b79cf5}
*{box-sizing:border-box}
body{margin:0;font-family:var(--bf,system-ui,-apple-system,Segoe UI,Roboto,sans-serif);color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:var(--hf,inherit)}
header{padding:18px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}
main{max-width:980px;margin:0 auto;padding:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.card img,.ph{width:100%;height:190px;object-fit:cover;display:block;background:#e9e4d6}
.card .b{padding:12px 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mute{color:var(--mute);font-size:13px}
.price{font-weight:700}
.btn{background:var(--gold);color:var(--onGold,#1f1a05);border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;width:100%;cursor:pointer}
.btn:hover{background:var(--gold2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--secBg,var(--panel));border:1px solid var(--line);color:var(--secText,var(--ink))}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px}}
.x{float:right;background:var(--chip);border:0;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin:8px 0}
.car img{flex:0 0 100%;height:230px;object-fit:cover;border-radius:12px;scroll-snap-align:start}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center;font-size:13px}.stat b{display:block;font-size:16px}
.cal{margin:10px 0}.cal .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cal button.n{background:var(--chip);border:0;border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.dow{font-size:11px;color:var(--mute);padding:4px 0}
.d{padding:10px 0;border-radius:8px;font-size:14px;border:1px solid transparent;background:var(--panel);cursor:pointer}
.d.free{background:var(--free)}
.d.occ{background:var(--occ);color:#a33;text-decoration:line-through;cursor:not-allowed}
.d.hol{background:var(--holb);color:var(--hol)}
.d.past{color:var(--mute);opacity:.5;cursor:not-allowed}
.d.sel{background:var(--gold);color:var(--onGold,#1f1a05);font-weight:700}
.d.mid{background:var(--mid)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:6px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=email],input[type=tel],input[type=number]{background:var(--panel);color:var(--ink);width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px;color:var(--ink)}
.sum{background:var(--bg);border-radius:12px;padding:12px;margin:12px 0;font-size:14px}
.sum .row{margin:3px 0}.sum .t{font-weight:800;font-size:17px;border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.err{color:var(--bad);font-size:14px;margin:8px 0}
.stepper{display:flex;align-items:center;gap:12px}.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:18px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:40px}
#hero{position:relative;height:260px;border-radius:16px;overflow:hidden;margin-bottom:16px;background:#222}
#hero .s{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .8s}
#hero .s.on{opacity:1}
#hero .t{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
#hero .t h2{margin:0;font-size:26px}
#promo{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:16px}
#promo img{flex:0 0 88%;max-width:520px;height:130px;object-fit:cover;border-radius:12px;scroll-snap-align:start}
#amstrip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 16px}
#amstrip span{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:14px}
#reviews{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:24px}
#reviews .q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px}
#reviews .q b{display:block;margin-top:8px;font-size:13px;color:var(--mute)}
header{background:#0b1226;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
header h1{font-size:19px;letter-spacing:1px;text-transform:uppercase}
header .mute{color:#aab4cf;font-size:12px}
header .btn.sec{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
#hero{position:relative;min-height:440px;height:auto;border-radius:0;margin:0 0 8px;overflow:hidden;background:linear-gradient(160deg,#070b16,#14203d);display:flex;align-items:center;justify-content:center;text-align:center}
#hero .s{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s}
#hero .s.on{opacity:1}
#hero .shade{position:absolute;inset:0;background:linear-gradient(rgba(7,11,22,.35),rgba(7,11,22,.72))}
#hero .t{position:relative;padding:40px 22px;color:#fff;max-width:640px;background:none}
#hero .t small{display:block;letter-spacing:4px;font-size:12px;color:var(--gold);margin-bottom:12px}
#hero .t h2{margin:0 0 10px;font-size:38px;line-height:1.15}
#hero .t p{margin:0 0 26px;color:#e2e6f2;font-size:16px}
#hero .cta{display:inline-block;background:var(--gold);color:var(--onGold,#1f1a05);border:0;border-radius:40px;padding:15px 44px;font-weight:700;letter-spacing:2px;font-size:14px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.coll{text-align:center;margin:26px 0 18px}
.coll small{display:block;letter-spacing:4px;font-size:11px;color:var(--gold)}
.coll h2{margin:6px 0 0;font-size:28px}
.card{cursor:default;border-radius:16px}
.imgw{position:relative}
.imgw .pb{position:absolute;top:12px;right:12px;background:rgba(7,11,22,.88);color:#fff;border:1px solid var(--gold);border-radius:12px;padding:6px 12px;text-align:right;font-weight:700;font-size:18px;line-height:1.1}
.imgw .pb i{display:block;font-style:normal;font-size:10px;font-weight:400;color:#c9d0e4;letter-spacing:1px}
.loc{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin:2px 0 4px}
.mini{display:flex;gap:14px;font-size:13px;color:var(--mute);margin:8px 0 12px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn{padding:11px 10px;font-size:14px;border-radius:12px}

:root{--c2:#0b1226}
header{background:var(--c2)}
.cband{margin:34px 0;border-radius:22px;padding:34px 22px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--c2),color-mix(in srgb,var(--c2) 55%,var(--gold)))}
.cband h3{margin:0 0 6px;font-size:24px}.cband p{margin:0 0 18px;opacity:.85}
.cband .btn{width:auto;display:inline-block;padding:15px 44px;border-radius:40px;letter-spacing:1px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.step{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 20px;text-align:center}
.step i{display:flex;align-items:center;justify-content:center;width:52px;height:52px;margin:0 auto 12px;border-radius:50%;background:var(--gold);color:var(--onGold,#1f1a05);font:700 22px var(--hf,inherit);font-style:normal}
.step b{display:block;font-size:17px;margin-bottom:6px;font-family:var(--hf,inherit)}.step span{color:var(--mute);font-size:14px;line-height:1.5}
.mv{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:34px}
.mv>div{border-radius:20px;padding:28px 24px;background:var(--c2);color:#fff}
.mv small{display:block;letter-spacing:4px;font-size:11px;color:var(--gold);margin-bottom:8px}
.mv h3{margin:0 0 10px;font-size:22px}.mv p{margin:0;line-height:1.65;opacity:.9;white-space:pre-wrap}
#reviews .q{border-radius:18px;padding:20px;position:relative}
#reviews .q img{width:54px;height:54px;border-radius:50%;object-fit:cover;margin-bottom:10px;border:2px solid var(--gold)}
#reviews .q:before{content:"\201C";position:absolute;right:16px;top:2px;font:700 54px/1 var(--hf,serif);color:var(--gold);opacity:.35}
.owner{display:grid;gap:22px;grid-template-columns:200px 1fr;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;margin-top:8px}
.owner>img,.owner .nophoto{width:200px;height:200px;border-radius:50%;object-fit:cover;border:4px solid var(--gold)}
.owner h3{margin:0;font-size:28px}.owner .sub{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--gold);font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin:6px 0 12px}
.owner p{white-space:pre-wrap;line-height:1.65;margin:0 0 14px}
.soc{display:flex;gap:10px;flex-wrap:wrap}
.soc a{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--c2);color:#fff;transition:transform .15s,background .15s}
.soc a:hover{transform:translateY(-2px);background:var(--gold);color:var(--onGold,#1f1a05)}.soc svg{width:20px;height:20px}
@media(max-width:640px){.owner{grid-template-columns:1fr;text-align:center}.owner>img,.owner .nophoto{margin:0 auto}.owner .sub,.soc{justify-content:center}}
.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.12)}
html{scroll-behavior:smooth}

body.themed{background:linear-gradient(165deg,var(--gold) 0%,color-mix(in srgb,var(--gold) 76%,var(--c2)) 100%);min-height:100vh}
body.themed .coll h2,body.themed #hook h2,body.themed #hook p,body.themed #foot,body.themed .empty{color:var(--bgInk)}
body.themed #hook{background:var(--hkBg,transparent);border-radius:22px;padding:26px 20px;box-shadow:0 8px 26px rgba(0,0,0,.14)}
body.themed #hook h2,body.themed #hook p{color:var(--hkInk,var(--bgInk))}
body.themed .coll small{color:var(--bgInk);opacity:.7}
body.themed #foot a,body.themed main>div>a{color:var(--bgInk)!important}
.mv small{color:#fff!important;opacity:.7}
#hook{text-align:center;max-width:760px;margin:34px auto 6px}
#hook h2{margin:0;font:700 clamp(26px,5vw,40px)/1.2 var(--bf,inherit)}
#hook p{margin:12px 0 0;font-size:17px;opacity:.85;line-height:1.55}
#hero{background:var(--c2)}

.ac{font-family:var(--af,var(--hf,inherit));font-style:normal;font-weight:400;font-size:1.14em;letter-spacing:.01em}
#hero{min-height:600px;isolation:isolate;background:radial-gradient(60% 80% at 14% 16%,color-mix(in srgb,var(--gold) 65%,transparent),transparent 62%),radial-gradient(70% 90% at 92% 92%,color-mix(in srgb,var(--gold) 30%,var(--c2)),transparent 66%),var(--c2)}
#hero .s{transform:scale(1.05)}
#hero.hs-soft .s{filter:saturate(1.05) brightness(.93) contrast(.98)}
#hero.hs-warm .s{filter:sepia(.2) saturate(1.25) brightness(.95)}
#hero.hs-moody .s{filter:brightness(.68) contrast(1.15) saturate(.9)}
#hero.hs-bright .s{filter:brightness(1.06) saturate(1.12)}
#hero .shade{background:radial-gradient(circle at 18% 8%,color-mix(in srgb,var(--gold) 30%,transparent),transparent 55%),linear-gradient(180deg,color-mix(in srgb,var(--c2) 58%,transparent) 0%,color-mix(in srgb,var(--c2) 22%,transparent) 42%,color-mix(in srgb,var(--c2) 88%,transparent) 100%);z-index:1}
#hero.hs-bright .shade{background:linear-gradient(180deg,color-mix(in srgb,var(--c2) 35%,transparent),color-mix(in srgb,var(--c2) 70%,transparent))}
#hero .t{z-index:2;max-width:700px;margin:40px 18px;padding:46px 38px;border-radius:30px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.28)}
#hero .t small{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;opacity:.85}
#hero .t small:before,#hero .t small:after{content:"";width:34px;height:1px;background:var(--gold)}
#hero .t h2{font-family:var(--hf,inherit);font-size:clamp(34px,6vw,56px);letter-spacing:.5px;text-shadow:0 2px 24px rgba(0,0,0,.35)}
#hero .t p{font-family:var(--bf,inherit);font-size:18px;line-height:1.55}
#hero:after{content:"\2304";position:absolute;left:50%;bottom:14px;transform:translateX(-50%);color:#fff;font-size:26px;opacity:.7;z-index:2;animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}

header.row{gap:14px}
header .tagl{margin-left:auto;text-align:right;font:italic 400 15px/1.3 var(--bf,inherit);letter-spacing:.6px;color:#e6ebf7;max-width:340px}
header .tagm{display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:italic 12px var(--bf,inherit);color:#aab4cf}
header .tagl .ac,header .tagm .ac{font-style:normal;color:var(--gold)}
@media(max-width:760px){header .tagl{display:none}header .tagm{display:block}}
#hero .t p{display:none}

.shr{margin-top:8px;padding:10px;font-size:14px;border-radius:12px}
.chatsec{margin:26px 0 8px;border-radius:22px;padding:28px 22px;text-align:center;background:var(--panel);border:1px solid var(--line)}
.chatsec h3{margin:0 0 6px;font-size:22px;font-family:var(--hf,inherit)}.chatsec p{margin:0 0 16px;color:var(--mute)}
.chbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chbtns a{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:40px;color:#fff;font-weight:700;text-decoration:none;font-size:15px}
.chbtns .ms{background:#0084ff}.chbtns .cl{background:#2e8b57}.chbtns .tx{background:#444}.chbtns .vb{background:#7360f2}
#chatfab{position:fixed;right:16px;bottom:16px;z-index:15}
#chatfab>button{background:#0084ff;color:#fff;border:0;border-radius:50%;width:46px;height:46px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28)}#chatfab svg,#mbar .mi svg{width:22px;height:22px;fill:#fff}#mbar .mi{flex:0 0 46px;width:46px;height:46px;padding:0;border-radius:50%;background:#0084ff;border:0;display:flex;align-items:center;justify-content:center}
#chatpanel{display:none;position:absolute;right:0;bottom:56px;width:270px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 44px rgba(0,0,0,.3)}
#chatpanel.on{display:block}#chatpanel .chbtns{flex-direction:column}#chatpanel .chbtns a{justify-content:center}

#chatpanel{position:fixed;right:16px;bottom:78px;z-index:16}
#mbar{display:none}
.dsk{display:inline}.mob{display:none}
@media(max-width:640px){
  .dsk{display:none}.mob{display:inline}
  header,header.row{padding:10px 12px;gap:8px;flex-wrap:nowrap}
  header>div:first-child{flex:1;min-width:0;overflow:hidden}
  header>div:first-child>div{min-width:0;overflow:hidden}
  header h1{font-size:15px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header img#logo{height:34px!important}
  header .btn.sec,#acct .btn,#acct button{width:auto!important;padding:9px 11px!important;font-size:13px!important;min-height:40px}
  #acct{margin-left:0!important}
  #hero{min-height:430px}
  #hero .t{margin:22px 14px;padding:30px 20px;border-radius:24px}
  #hero .t h2{font-size:34px}
  main{padding:12px}
  .coll{margin:22px 0 14px}.coll h2{font-size:24px}
  #hook{margin:24px auto 4px}
  .steps{grid-template-columns:1fr;gap:10px}
  .step{display:grid;grid-template-columns:48px 1fr;gap:2px 14px;text-align:left;padding:16px}
  .step i{grid-row:1/3;margin:0;width:44px;height:44px;font-size:19px;align-self:center}
  .mv>div{padding:20px 18px}
  .cband{margin:24px 0;padding:26px 18px}
  .shr,.acts .btn,.btn{min-height:46px}
  .owner{padding:20px 16px}.owner>img,.owner .nophoto{width:150px;height:150px}.owner h3{font-size:24px}
  .owner .sub a,#foot a,main>div>a{display:inline-block;padding:12px 4px}
  .soc a{width:48px;height:48px}
  .chatsec{padding:22px 14px}.chbtns a{padding:14px 18px;min-height:46px}
  #chatfab{display:none}
  #mbar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--c2);box-shadow:0 -8px 24px rgba(0,0,0,.25)}
  #mbar .btn{flex:1;width:auto;border-radius:14px;padding:12px}
  #mbar .btn.sec{flex:0 0 auto;width:auto;background:#0084ff;color:#fff;border:0}
  #chatpanel{left:12px;right:12px;width:auto;bottom:74px}
  body{padding-bottom:76px}
  .sheet{max-height:96vh;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
  .x{width:42px;height:42px}
  .d{padding:13px 0}
  .cal button.n{width:46px;height:46px}.stepper button{width:46px;height:46px}
  .chk{min-height:44px}.chk input[type=checkbox]{width:22px;height:22px}
  input[type=file],input[type=text],input[type=email],input[type=tel],input[type=number],textarea,select{font-size:16px!important}
  .stat{padding:8px 4px}
}

/* ===== 4-page layout ===== */
header,header.row{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:nowrap}
header>div:first-child,header>div:first-child>div{overflow:visible}
.menubtn{width:46px;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:transparent;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 12px;cursor:pointer}
.menubtn span{display:block;height:2px;background:#fff;border-radius:2px}
header img#logo{height:44px!important;max-width:60vw;object-fit:contain}
#brandfb{color:#fff;font-size:15px;letter-spacing:1px;text-transform:uppercase;max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#navbk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:18}
#navmenu{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);background:var(--panel);color:var(--ink);z-index:19;transform:translateX(102%);transition:transform .22s;padding:70px 16px 20px;overflow:auto;box-shadow:0 0 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px}
#navmenu.on{transform:none}#navbk.on{display:block}
#navmenu a{display:block;padding:15px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:17px;min-height:48px;box-sizing:border-box}
#navmenu a.cur{background:var(--gold);color:var(--onGold,#1f1a05)}
#navmenu a#navphone{border:1px solid var(--line);margin-top:8px;text-align:center}
#navmenu .btn{margin-top:6px;width:100%}
#navmenu #acct{margin:8px 0 0!important;display:block}#navmenu #acct .btn,#navmenu #acct button{width:100%!important;margin-top:6px}
#hero{min-height:420px!important}

const ds = (y, m, d) => y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
const addD = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const nightsBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5);
const rangeFree = (a, b) => { for (let d = a; d < b; d = addD(d, 1)) if (blocked.has(d)) return false; return true; };

function calendarHTML() {
  const first = new Date(Date.UTC(view.y, view.m, 1)), dim = new Date(Date.UTC(view.y, view.m + 1, 0)).getUTCDate();
  const label = first.toLocaleString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  let cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<div class="dow">${x}</div>`).join('');
  for (let i = 0; i < first.getUTCDay(); i++) cells += '<div></div>';
  for (let d = 1; d <= dim; d++) {
    const s = ds(view.y, view.m, d); let c = 'free', title = '';
    if (s < DATA.today) c = 'past'; else if (blocked.has(s)) c = 'occ'; else if (hol[s]) { c = 'hol'; title = hol[s].name + (hol[s].pct ? ' (+' + hol[s].pct + '%)' : ''); }
    if (start && s === start) c = 'sel'; else if (end && s === end) c = 'sel'; else if (start && end && s > start && s < end) c = 'mid';
    cells += `<div class="d ${c}" title="${esc(title)}" onclick="pick('${s}')">${d}</div>`;
  }
  return `<div class="cal"><div class="h"><button class="n" onclick="mv(-1)">‹</button><b>${label}</b><button class="n" onclick="mv(1)">›</button></div><div class="days">${cells}</div>
    <div class="legend"><span><i style="background:var(--free)"></i>Available</span><span><i style="background:var(--occ)"></i>Occupied</span><span><i style="background:var(--holb)"></i>Holiday</span><span><i style="background:var(--gold)"></i>Selected</span></div></div>`;
}
function mv(n) { view.m += n; if (view.m < 0) { view.m = 11; view.y--; } if (view.m > 11) { view.m = 0; view.y++; } renderBooking(true); }
function pick(s) {
  if (s < DATA.today) return;
  if (start && !end && s > start && rangeFree(start, s)) { end = s; }
  else if (!blocked.has(s)) { start = s; end = null; }
  else return;
  renderBooking(true);
}

function calc() {
  if (!start || !end) return null;
  const n = nightsBetween(start, end), base = n * unit.price, extra = Math.max(0, guests - unit.baseGuests) * unit.extraGuestFee * n;
  let holx = 0; for (let d = start; d < end; d = addD(d, 1)) if (hol[d]) holx += unit.price * hol[d].pct / 100;
  holx = Math.round(holx);
  const pet = pets ? Number(unit.petFee) : 0, ad = UA().filter(a => addonIds.has(a.id));
  return { n, base, holx, extra, pet, ad, total: base + holx + extra + pet + ad.reduce((s, a) => s + Number(a.price), 0) };
}

   <div id="dl_s2" style="display:none"><h3>Step 2 · Scan and pay</h3><img class="dl-qr" src="${esc(SI.payQrUrl)}" alt="Payment QR code">${SI.payNote ? `<p class="mute" style="white-space:pre-wrap;text-align:center">${esc(SI.payNote)}</p>` : ''}<label>Attach your payment screenshot</label><input name="proof" type="file" accept="image/*,application/pdf"><div class="mute" style="margin-top:4px">Photo or PDF, up to 5 MB.</div><input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><div class="err" id="payerr2" role="alert"></div><button class="btn" id="paygo" type="submit" style="margin-top:14px">Send my payment</button><button class="btn sec" type="button" style="margin-top:8px" onclick="dlBack()">Back</button></div>
  </form>

  ${F.length ? '<div class="coll dl-sec"><small>FAQ</small><h2>Questions, answered</h2></div><div class="faqw">' + faqHTML(F) + '</div>' : ''}
  <div class="cband"><h3>Ready to claim ${esc(title)}?</h3><p>It takes about a minute.</p><button class="btn" type="button" onclick="dlGo('dl_co')">${esc(SI.ctaText || 'Claim this offer')}</button></div>`;

const emphF = t => String(t).replace(/\*([^*]+)\*/g, '<em class="ac">$1</em>');
function chatLinks(H) {
  const SI = (H && H.site) || {}, out = [], ph = String(H.contactPhone || '').replace(/[^0-9+]/g, ''), intl = ph.replace(/^\+/, '').replace(/^0/, '63');
  const ms = String(SI.chatMessenger || '').replace(/[^A-Za-z0-9._\-]/g, '');
  if (ms) out.push(['ms', '💬 Chat on Messenger', 'https://m.me/' + ms, true]);
  return out;
}
const MSGR = '<svg viewBox="0 0 24 24"><path d="M12 2C6.4 2 2 6.1 2 11.3c0 2.9 1.4 5.4 3.6 7.1V22l3.3-1.8c1 .3 2 .4 3.1.4 5.6 0 10-4.1 10-9.3S17.6 2 12 2zm1 12.5-2.5-2.7-4.9 2.7 5.4-5.7 2.6 2.7 4.8-2.7-5.4 5.7z"/></svg>';
function toggleChat() { const p = document.getElementById('chatpanel'); if (p) p.classList.toggle('on'); }
function drawMbar(label) {
  let m = document.getElementById('mbar'); if (!m) { m = document.createElement('div'); m.id = 'mbar'; document.body.appendChild(m); }
  m.innerHTML = `<button class="btn" onclick="CTA_GO()">${esc(label)}</button>` + (window.HAS_CHAT ? `<button class="mi" onclick="toggleChat()" aria-label="Chat on Messenger">${MSGR}</button>` : '');
}
function drawChat(H) {
  const L = chatLinks(H); if (!L.length) return;
  const btns = L.map(x => `<a class="${x[0]}" href="${esc(x[2])}"${x[3] ? ' target="_blank" rel="noopener"' : ''}>${x[1]}</a>`).join('');
  $('#chat').innerHTML = `<div class="chatsec"><h3>Chat with the owner</h3><p>Have a question? Message us on Messenger.</p><div class="chbtns">${btns}</div></div>`;
  if (!document.getElementById('chatfab')) { const d = document.createElement('div'); d.id = 'chatfab'; d.innerHTML = `<button onclick="toggleChat()" aria-label="Chat on Messenger">${MSGR}</button>`; document.body.appendChild(d); const pn = document.createElement('div'); pn.id = 'chatpanel'; pn.innerHTML = `<b>Chat with the owner</b><div class="chbtns" style="margin-top:10px">${btns}</div>`; document.body.appendChild(pn); }
  window.HAS_CHAT = true;
}
function drawSite(H, hid) {
  const SI = (H && H.site) || {}, https = u => /^https:\/\//.test(u || '');
  const hasL = (DATA.listings || []).some(x => !hid || String(x.ownerId) === hid), hasS = (DATA.services || []).some(x => !hid || String(x.ownerId) === hid), hasP = (DATA.products || []).some(x => !hid || String(x.ownerId) === hid);
  const bt = (H && H.businessType) || (DATA.units.length ? 'staycation' : hasL ? 'real_estate' : 'business');
  const label = SI.ctaText || (bt === 'real_estate' ? 'Inquire Now' : bt === 'business' ? (hasP && !hasS ? 'Buy Now' : hasS && !hasP ? 'Book Now' : 'Buy / Book Now') : 'Book Now');
  const target = bt === 'real_estate' ? 'lst' : bt === 'business' ? (hasS ? 'svc' : 'prd') : 'coll';
  window.CTA_GO = () => { goPage('services'); setTimeout(() => { const el = document.getElementById(target); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 60); }; { const nc = document.getElementById('navcta'); if (nc) nc.textContent = label; }
  const sub = bt === 'real_estate' ? 'Tell us what you are looking for.' : bt === 'business' ? 'Pick what you need and we will take it from here.' : 'Pick your dates and secure your stay.';
  const cta = '<div class="cband"><h3>Ready when you are</h3><p>' + esc(sub) + '</p><button class="btn" onclick="CTA_GO()">' + esc(label) + '</button></div>';
  const hc = document.querySelector('#hero .cta'); if (hc) { hc.textContent = label.toUpperCase(); hc.setAttribute('onclick', 'CTA_GO()'); }
  if (!H) { drawMbar(label); return; }
  if (SI.hook) $('#hook').innerHTML = '<h2>' + emphF(esc(SI.hook)) + '</h2>' + (SI.hookSub ? '<p>' + emphF(esc(SI.hookSub)) + '</p>' : '');
  const W = (SI.why || []).filter(w => w && (w.title || w.text));
  if (hasL || hasS || hasP || DATA.units.length) $('#cta1').innerHTML = cta;
  if (W.length) $('#why').innerHTML = '<div class="coll"><small>WHY US</small><h2>' + esc(SI.whyTitle || 'Why choose us') + '</h2></div><div class="steps">' + W.map((w, i) => `<div class="step"><i>${i + 1}</i><b>${emphF(esc(w.title))}</b><span>${emphF(esc(w.text))}</span></div>`).join('') + '</div>';
  if (SI.mission || SI.vision) { $('#mv').innerHTML = '<div class="mv">' + (SI.mission ? `<div><small>OUR MISSION</small><h3>Mission</h3><p>${emphF(esc(SI.mission))}</p></div>` : '') + (SI.vision ? `<div><small>OUR VISION</small><h3>Vision</h3><p>${emphF(esc(SI.vision))}</p></div>` : '') + '</div>'; if (hasL || hasS || hasP || DATA.units.length) $('#cta2').innerHTML = cta; }
  const T = Array.isArray(H.testimonials) ? H.testimonials.filter(t => t && t.text) : [];
  if (T.length) $('#reviews').innerHTML = '<div class="coll" style="grid-column:1/-1"><small>TESTIMONIALS</small><h2>What our customers say</h2></div>' + T.map(t => `<div class="q">${https(t.photo) ? `<img src="${esc(t.photo)}" alt="">` : ''}“${esc(t.text)}”<b>— ${esc(t.name || 'Customer')}</b></div>`).join('');
  drawChat(H); drawMbar(label);
  const so = H.socials || {}, L = ['facebook', 'instagram', 'tiktok', 'youtube', 'website'].filter(k => https(so[k]));
  const name = SI.ownerName || H.hostName || H.businessName || '';
  if (H.about || H.ownerPhotoUrl || H.contactPhone || H.contactEmail || L.length || SI.salutation || SI.license || SI.ownerName) {
    const a = $('#about'); a.style.display = 'block';
    const subs = [SI.salutation, SI.license, H.contactPhone ? `<a href="tel:${esc(H.contactPhone)}" style="color:inherit">${esc(H.contactPhone)}</a>` : ''].filter(Boolean);
    a.innerHTML = '<div class="coll"><small>THE OWNER</small><h2>Meet the owner</h2></div><div class="owner">' +
      (https(H.ownerPhotoUrl) ? `<img src="${esc(H.ownerPhotoUrl)}" alt="">` : '<div class="nophoto" style="background:var(--c2)"></div>') +
      `<div><h3>${esc(name)}</h3>${subs.length ? '<div class="sub">' + subs.map((x, i) => (x === SI.salutation ? esc(x) : x === SI.license ? esc(x) : x)).map(x => `<span>${x}</span>`).join('') + '</div>' : ''}` +
      (H.about ? `<p>${esc(H.about)}</p>` : '') +
      `<div class="soc">${L.map(k => `<a href="${esc(so[k])}" target="_blank" rel="noopener" aria-label="${k}">${ICO[k]}</a>`).join('')}${H.contactPhone ? `<a href="tel:${esc(H.contactPhone)}" aria-label="Call">${ICO.phone}</a>` : ''}${H.contactEmail ? `<a href="mailto:${esc(H.contactEmail)}" aria-label="Email">${ICO.mail}</a>` : ''}</div></div></div>`;
  }
}

function drawExtras(hid) {
  const L = (DATA.listings || []).filter(x => !hid || String(x.ownerId) === hid), V = (DATA.services || []).filter(x => !hid || String(x.ownerId) === hid);
  const P = (DATA.products || []).filter(x => !hid || String(x.ownerId) === hid); DATA.products = P; DATA.listings = L; DATA.services = V;
  if (P.length) $('#prd').innerHTML = '<div class="coll"><small>PRODUCTS</small><h2>Shop</h2></div><div class="grid">' + P.map((x, i) => `<div class="card" id="c_p_${esc(x.id)}">${x.images[0] ? `<div class="imgw"><img src="${esc(x.images[0])}" alt=""></div>` : ''}<div class="b"><div class="row"><b style="font-size:18px">${esc(x.name)}</b><b>${peso(x.price)}</b></div><div style="margin:6px 0">${esc(x.description)}</div>${x.stock === 0 ? '<div class="mute">Out of stock</div>' : orderBtn(x)}${shareBtn('product', i)}</div></div>`).join('') + '</div>';
  if (L.length) $('#lst').innerHTML = '<div class="coll"><small>PROPERTIES</small><h2>Properties for sale &amp; rent</h2></div><div class="grid">' + L.map((x, i) => `<div class="card"><div class="imgw">${x.images[0] ? `<img src="${esc(x.images[0])}" alt="" onclick="openListing(${i})" style="cursor:pointer">` : '<div class="ph"></div>'}</div>
    <div class="b"><div class="row"><b style="font-size:18px">${esc(x.title)}</b><span class="mute">${x.listingType === 'rent' ? 'For rent' : 'For sale'}</span></div><div class="loc">📍 ${esc(x.location)}</div>
    <div class="mini"><span>🛏 ${esc(x.bedrooms)}</span><span>🚿 ${esc(x.bathrooms)}</span>${x.floorArea ? `<span>📐 ${esc(x.floorArea)} sqm</span>` : ''}</div><b style="font-size:18px">${peso(x.price)}${x.listingType === 'rent' ? '/mo' : ''}</b>
    <div class="acts" style="margin-top:8px"><button class="btn sec" onclick="openListing(${i})">👁 View</button><button class="btn" onclick="inquire(${i})">✉️ Inquire</button></div>${shareBtn('listing', i)}</div></div>`).join('') + '</div>';
  if (V.length) $('#svc').innerHTML = '<div class="coll"><small>SERVICES</small><h2>Book an appointment</h2></div><div class="grid">' + V.map((x, i) => `<div class="card">${x.images[0] ? `<div class="imgw"><img src="${esc(x.images[0])}" alt=""></div>` : ''}<div class="b"><div class="row"><b style="font-size:18px">${esc(x.name)}</b><b>${peso(x.price)}</b></div>
    <div class="mute">⏱ ${esc(x.durationMinutes)} min</div><div style="margin:6px 0">${esc(x.description)}</div><button class="btn" onclick="bookService(${i})">📅 Book now</button>${shareBtn('service', i)}</div></div>`).join('') + '</div>';
  try { const q = new URLSearchParams(location.search), l = q.get('listing'), sv = q.get('service'); if (l) { const k = L.findIndex(x => x.id === l); if (k >= 0) openListing(k); } if (sv) { const k = V.findIndex(x => x.id === sv); if (k >= 0) bookService(k); } const pr = q.get('product'); if (pr) setTimeout(() => { const e = document.getElementById('c_p_' + pr); if (e) { e.scrollIntoView({ behavior: 'smooth', block: 'center' }); e.style.outline = '3px solid var(--gold)'; } }, 400); } catch (e) {}
}
function orderBtn(x) {
  const msg = encodeURIComponent('Hi, I would like to order: ' + x.name);
  const wa = String(x.contactPhone || '').replace(/[^0-9]/g, '');
  return x.contactEmail ? `<a class="btn" style="display:block;text-align:center;text-decoration:none" href="mailto:${esc(x.contactEmail)}?subject=${encodeURIComponent('Order: ' + x.name)}">🛒 Order / Ask</a>` : wa ? `<a class="btn" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${msg}">🛒 Order / Ask</a>` : '<div class="mute">Contact the seller to order.</div>';
}
function openListing(i) {
  const x = DATA.listings[i];
  show(`${x.images.map(u => `<img src="${esc(u)}" alt="" style="width:100%;border-radius:12px;margin-bottom:8px">`).join('')}<h3 style="margin:6px 0">${esc(x.title)}</h3><div class="mute">📍 ${esc(x.location)} · ${esc(x.propertyType)} · ${x.listingType === 'rent' ? 'For rent' : 'For sale'}</div>
    <div class="mini"><span>🛏 ${esc(x.bedrooms)}</span><span>🚿 ${esc(x.bathrooms)}</span>${x.floorArea ? `<span>📐 ${esc(x.floorArea)} sqm</span>` : ''}${x.lotArea ? `<span>🌳 ${esc(x.lotArea)} sqm lot</span>` : ''}</div>
    <b style="font-size:20px">${peso(x.price)}${x.listingType === 'rent' ? '/mo' : ''}</b><p style="white-space:pre-wrap">${esc(x.description)}</p><button class="btn" onclick="inquire(${i})">✉️ Inquire about this property</button>`);
}
function inquire(i, msg, err) {
  const x = DATA.listings[i];
  show(`<h3 style="margin:4px 0">Inquire: ${esc(x.title)}</h3>${err ? `<div class="err">${esc(err)}</div>` : ''}<label>Your name</label><input id="iq_n"><label>Email</label><input id="iq_e" type="email"><label>Phone</label><input id="iq_p" type="tel">
    <label>Preferred viewing date (optional)</label><input id="iq_d" type="date"><label>Message</label><textarea id="iq_m" rows="3"></textarea><button class="btn" id="iq_go" style="margin-top:10px" onclick="sendInquiry(${i})">Send inquiry</button>`);
}
async function sendInquiry(i) {
  const x = DATA.listings[i], g = id => $('#' + id).value.trim(); if (!g('iq_n') || !/^\S+@\S+\.\S+$/.test(g('iq_e')) || !g('iq_p')) return alert('Please fill in your name, a valid email and phone.');
  $('#iq_go').disabled = true;
  try { const r = await run('createInquiry', { listingId: x.id, name: g('iq_n'), email: g('iq_e'), phone: g('iq_p'), message: g('iq_m'), date: g('iq_d') });
    show(`<h3>Inquiry sent ✓</h3><p>Reference <b>${esc((r && (r.id || r.ref)) || '')}</b>. ${esc(x.hostName || 'The owner')} will contact you soon.</p><p class="mute" id="mailnote"></p><button class="btn" onclick="closeSheet()">Done</button>`); notifyMail('inquiry', r && (r.id || r.ref), '', document.getElementById('mailnote')); }
  catch (e) { $('#iq_go').disabled = false; alert(e.message); }
}
function bookService(i) {
  const x = DATA.services[i]; const t = manilaToday();
  show(`<h3 style="margin:4px 0">${esc(x.name)}</h3><div class="mute">${peso(x.price)} · ${esc(x.durationMinutes)} min</div><label>Pick a date</label><input id="ap_d" type="date" min="${t}" value="${t}" onchange="loadSlots(${i})"><div id="ap_s" style="margin:8px 0"></div><div id="ap_f"></div>`);
  loadSlots(i);

let APS = null;
async function loadSlots(i) {
  const x = DATA.services[i], d = $('#ap_d').value; APS = null; $('#ap_f').innerHTML = ''; $('#ap_s').innerHTML = '<span class="mute">Loading times…</span>';
  try { const l = await run('availableSlots', x.id, d);
    $('#ap_s').innerHTML = (l || []).map(t => `<button class="btn sec sm" style="margin:3px" onclick="pickSlot(${i},'${esc(t)}',this)">${new Date(t).toLocaleTimeString('en-PH', { timeZone: 'Asia/Manila', hour: 'numeric', minute: '2-digit' })}</button>`).join('') || '<span class="mute">No open times that day. Try another date.</span>'; }
  catch (e) { $('#ap_s').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }

function pickSlot(i, t, el) {
  APS = t; document.querySelectorAll('#ap_s .btn').forEach(b => { b.classList.add('sec'); }); el.classList.remove('sec');
  $('#ap_f').innerHTML = `<label>Your name</label><input id="ap_n"><label>Email</label><input id="ap_e" type="email"><label>Phone</label><input id="ap_p" type="tel"><label>Notes (optional)</label><textarea id="ap_m" rows="2"></textarea><button class="btn" id="ap_go" style="margin-top:10px" onclick="sendAppt(${i})">Confirm appointment</button>`;
}
async function sendAppt(i) {
  const x = DATA.services[i], g = id => $('#' + id).value.trim(); if (!APS) return alert('Pick a time first.'); if (!g('ap_n') || !/^\S+@\S+\.\S+$/.test(g('ap_e')) || !g('ap_p')) return alert('Please fill in your name, a valid email and phone.');
  $('#ap_go').disabled = true;
  try { const r = await run('createAppointment', { serviceId: x.id, start: APS, name: g('ap_n'), email: g('ap_e'), phone: g('ap_p'), notes: g('ap_m') });
    show(`<h3>Appointment requested ✓</h3><p>Reference <b>${esc((r && (r.id || r.ref)) || '')}</b>.</p>${x.payInfo ? `<div class="sum"><b>How to pay</b><div style="white-space:pre-wrap">${esc(x.payInfo)}</div></div>` : ''}<p class="mute" id="mailnote"></p><button class="btn" onclick="closeSheet()">Done</button>`); notifyMail('appointment', r && (r.id || r.ref), '', document.getElementById('mailnote')); }
  catch (e) { $('#ap_go').disabled = false; alert(e.message); }
}
